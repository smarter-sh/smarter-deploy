---
#------------------------------------------------------------------------------
# Docker Compose File for Smarter Deploy
#
# This file defines and manages a multi-container application using Docker Compose.
# It will automatically start the following services:
#   - MySQL database: stores application data
#   - Redis server: provides fast in-memory data storage
#   - Celery worker: handles background tasks
#   - Application server: runs the main web application
#
# Each service runs in its own container, making it easy to develop, test, and deploy the application as a complete stack.
#
# After starting, the main application will be available at http://localhost:8000.
#
# To start all services, run:
#   docker-compose up
#
# To stop all services, run:
#   docker-compose down
#
# For more information about Docker and Docker Compose, see:
#   https://docs.docker.com/compose/
#------------------------------------------------------------------------------
services:
  smarter-mysql:
    container_name: smarter-mysql
    mem_limit: 2g
    cpus: 0.5
    image: mysql:8
    command: ["mysqld", "--mysql-native-password=ON"]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: smarter
      MYSQL_DATABASE: smarter
      MYSQL_USER: smarter
      MYSQL_PASSWORD: smarter
    ports:
      - 3306:3306
    volumes:
      - ./mysql-data:/var/lib/mysql

  smarter-redis:
    container_name: smarter-redis
    mem_limit: 1g
    cpus: 0.25
    image: redis:latest
    command: redis-server --requirepass smarter

  smarter-app:
    container_name: smarter-app
    mem_limit: 4g
    cpus: 1
    user: smarter_user
    image: mcdaniel0073/smarter:19489667186
    command: gunicorn smarter.wsgi:application -b 0.0.0.0:8000 --timeout 120
    volumes:
      - type: bind
        source: ./smarter
        target: /smarter
        consistency: cached
    ports:
      - 8000:8000
    depends_on:
      - smarter-mysql
      - smarter-redis
      - smarter-worker
    env_file:
      - ./.env

  smarter-worker:
    container_name: smarter-worker
    mem_limit: 2g
    cpus: 0.5
    user: smarter_user
    image: mcdaniel0073/smarter:19489667186
    command: celery -A smarter.workers.celery.app worker --concurrency=4 --loglevel=info -Q default_celery_task_queue -E
    depends_on:
      - smarter-mysql
      - smarter-redis
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./smarter
        target: /smarter
        consistency: cached
    healthcheck:
      test:
        ["CMD", "celery", "-A", "smarter.workers.celery.app", "inspect", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  smarter-beat:
    container_name: smarter-beat
    mem_limit: 1g
    cpus: 0.5
    user: smarter_user
    image: mcdaniel0073/smarter:19489667186
    command: celery -A smarter.workers.celerybeat.app beat --loglevel=info
    depends_on:
      - smarter-mysql
      - smarter-redis
    env_file:
      - ./.env
    volumes:
      - type: bind
        source: ./smarter
        target: /smarter
        consistency: cached
    healthcheck:
      test:
        [
          "CMD",
          "celery",
          "-A",
          "smarter.workers.celerybeat.app",
          "inspect",
          "ping",
        ]
      interval: 30s
      timeout: 30s
      retries: 3
